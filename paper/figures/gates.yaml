# Release switches for figures that need an unconfirmed input. Only Rahul flips these.
# While a switch is false, the figures it gates are not drawn (STATUS.md says NOT BUILT);
# analysis.py still reads their input files, so a missing or renamed file fails the build.

# Reconstitution volume confirmed (01_qc/*/is_vs_calibration.tsv currently assumes 100 uL).
# Gates Fig S4 (internal standards vs calibration, apparent recovery).
reconstitution_volume_confirmed: true   # Rahul, 2026-11-25: 200 uL
reconstitution_volume_ul: 200            # replaces the 100 uL assumed in the 01_qc export
is_calibration_date: "2023-03-27"         # Rahul, 2026-11-25: fit S4 on the 27 Mar series only

# Fig S4 shown in the supplement. Off (Rahul, 2026-11-25): with 200 uL and the 10 ng spike the
# apparent recovery is above 100 % for every standard, so the calibration is checked first.
figS4_shown: false

# Stage-5 quantification on paper/results-2026-11 confirmed (Rahul, 2026-11-25).
# Gates Fig 5 (ClimGrass demonstration), Fig S5 (amounts per gram) and the Q3 points in S3D.
stage5_fix_confirmed: true

# Lipid traced in Fig 5D (lipid_name from 08_application/pos/responsive.tsv), e.g. "PC 30:1".
# Fig 5 is drawn without panel D while this is null.
fig7E_lipid: "PC 30:1"   # Rahul, 2026-11-25
